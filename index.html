<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flawsome by Kiarash</title>
  <style>
    body {
      background: #f2f2f2;
      color: #444;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .logo {
      font-size: 3rem;
      font-weight: bold;
      color: goldenrod;
      text-shadow: 1px 1px 2px #aaa;
    }
    .tagline {
      margin-top: 0.5rem;
      font-size: 1.2rem;
      color: #888;
    }
    .links {
      margin-top: 2rem;
    }
    .links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.7rem 1.5rem;
      background-color: #ddd;
      color: #333;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 1px 1px 5px #bbb;
      transition: all 0.3s ease;
    }
    .links a:hover {
      background-color: goldenrod;
      color: white;
    }
  </style>
</head>
<body>
  <div class="logo">FLAWSOME</div>
  <div class="tagline">by Kiarash</div>
  <div class="links">
    <a href="https://t.me/FlawsomeByKiarash" target="_blank">Telegram</a>
    <a href="https://instagram.com/FlawsomeByKiarash" target="_blank">Instagram</a>
  </div>
</body>
</html>
